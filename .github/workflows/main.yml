name: Buduj Śviętovit (szkielet)

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Zwolnienie miejsca na dysku
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Pamięć wymiany (swap)
        run: |
          free -h
          sudo swapoff -a || true
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Narzędzia
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer "cython<3" setuptools

      - name: Pamięć podręczna Androida
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            **/.buildozer
          key: buildozer-${{ hashFiles('**/buildozer.spec') }}

      - name: Budowanie aplikacji
        run: |
          APPDIR="$(dirname "$(find . -name buildozer.spec -not -path '*/.buildozer/*' | head -n 1)")"
          echo "Katalog aplikacji: $APPDIR"
          cd "$APPDIR"
          echo "APPDIR=$PWD" >> "$GITHUB_ENV"
          grep -n "^android.archs" buildozer.spec
          unset ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK_LATEST_HOME ANDROID_HOME ANDROID_SDK_ROOT
          yes | buildozer -v android debug > /tmp/build.log 2>&1 || { echo "=== BŁĘDY W LOGU ==="; grep -nEi "error|failed|fatal|undefined|not found|No such" /tmp/build.log | grep -v "install -c" | head -n 40; echo "=== KONIEC LOGU ==="; grep -v "install -c" /tmp/build.log | tail -n 60; df -h /; exit 1; }
          ls bin/*.apk

      - name: Plik APK
        uses: actions/upload-artifact@v4
        with:
          name: svietovit-szkielet-apk
          path: ${{ env.APPDIR }}/bin/*.apk
          if-no-files-found: error

      - name: Pełny log (gdy błąd)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
