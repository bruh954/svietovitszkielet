name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK (debug + release)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/SkanerPDF.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SkanerPDF-apk
          path: out/SkanerPDF.apk

      - name: Publish release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Skaner PDF 1.0.${{ github.run_number }}
          body: "Pobierz plik SkanerPDF.apk i zainstaluj na telefonie (Android 7.0+)."
          files: out/SkanerPDF.apk
          make_latest: true
